.mut{color:var(--mut);font-size:13px}

.big{display:grid;gap:10px}.big button{padding:18px;font-size:18px;font-weight:600;text-align:left}
.warn{background:color-mix(in srgb,var(--ac) 16%,var(--card));border:1px solid var(--ac);border-radius:14px;padding:12px;margin:10px 0}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tb button{flex:1;border:0;background:none;font-size:12px;padding:6px 2px}.tb button.on{color:var(--ac);font-weight:700}
.tb span{display:block;font-size:20px}
.pick{width:100%;text-align:left;font-weight:600;display:flex;justify-content:space-between}
.b{font-size:12px;border-radius:99px;padding:2px 8px;background:var(--in);color:var(--mut);white-space:nowrap}
.b.hot{color:var(--hot);border:1px solid var(--hot)}.b.cold{color:var(--cold);border:1px solid var(--cold)}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.sets input{width:58px;text-align:center}
.lab{font-size:12px;color:var(--mut);margin:8px 0 2px}
#ov{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}
#ov .sh{background:var(--bg);width:100%;max-height:82%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin:6px 0;text-align:left}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
.x{color:var(--mut);padding:2px 8px;min-height:36px;min-width:36px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;display:none;z-index:10}
svg{width:100%;height:auto;display:block}

 const GO=['klatka','triceps','barki','biceps','plecy','brzuch'],names=[...new Set(D().ent.map(e=>e.g+'|'+e.ex))].sort(),tn=[...new Set(D().trials.map(e=>e.ex))].sort();
 const pts=series(CH.src,from),f=pts[0],l=pts[pts.length-1];
 const per=[[30,'1 mies.'],[90,'3 mies.'],[180,'6 mies.'],[365,'Rok'],[0,'Wszystko']];
 const sess=new Set(D().ent.filter(e=>e.d>=from).map(e=>e.t+e.d)).size;
 const pr={};D().ent.filter(e=>e.d>=from).forEach(e=>{(pr[e.g+'|'+e.ex]=pr[e.g+'|'+e.ex]||[]).push(e)});
 const rows=Object.keys(pr).map(n=>{const a=pr[n].sort((x,y)=>x.d<y.d?-1:1);return{n:n.split('|')[1],g:n.split('|')[0],a:a[0].kg,b:a[a.length-1].kg,c:a.length}}).sort((x,y)=>GO.indexOf(x.g)-GO.indexOf(y.g)||(y.b-y.a)-(x.b-x.a));
 return`<div class="row">${per.map(x=>`<button class="${CH.per===x[0]?'sel':''}" onclick="CH.per=${x[0]};R()">${x[1]}</button>`).join('')}</div>
 <div class="card"><select onchange="CH.src=this.value;R()"><optgroup label="Pomiary ciała"><option value="m:w">Waga</option><option value="m:bic">Biceps</option><option value="m:kl">Klatka</option><option value="m:brz">Brzuch</option></optgroup>${GO.map(g=>{const a=names.filter(n=>n.startsWith(g+'|'));return a.length?`<optgroup label="${GN[g]} (kg)">${a.map(n=>`<option value="e:${esc(n)}">${esc(n.split('|')[1])}</option>`).join('')}</optgroup>`:''}).join('')}${tn.length?`<optgroup label="Próby">${tn.map(n=>`<option value="t:${esc(n)}">Próba: ${esc(n)}</option>`).join('')}</optgroup>`:''}</select>
 <div style="margin-top:10px">${chart(pts)}</div>${f?`<div class="mut">Start: <b>${f.y}</b> → teraz: <b>${l.y}</b> · zmiana: <b>${(l.y-f.y>0?'+':'')+Math.round((l.y-f.y)*100)/100}</b> · rekord: <b>${Math.max(...pts.map(q=>q.y))}</b></div>`:''}</div>
 <div class="card"><b>Treningów w okresie: ${sess}</b></div>
 <h2>Progres ćwiczeń w okresie</h2><div class="card" style="overflow:auto"><table><tr><th>Ćwiczenie</th><th>Start</th><th>Teraz</th><th>Δ</th></tr>${rows.map((x,i)=>(i&&rows[i-1].g===x.g?'':`<tr><th colspan="4" style="color:var(--ac)">${GN[x.g]}</th></tr>`)+`<tr><td>${esc(x.n)}</td><td>${x.a}</td><td>${x.b}</td><td style="color:${x.b>x.a?'var(--hot)':x.b<x.a?'var(--cold)':'var(--mut)'}">${x.b>x.a?'+':''}${Math.round((x.b-x.a)*100)/100}</td></tr>`).join('')||'<tr><td>Brak danych</td></tr>'}</table></div>`}
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'&&tab==='wy'){}});
/* ---- próby ---- */
function vPr(){const names=[...new Set(D().cat.map(c=>c.n))].sort(),t=[...D().trials].sort((a,b)=>a.d<b.d?1:-1);
 const best={};D().trials.forEach(x=>best[x.ex]=Math.max(best[x.ex]||0,x.kg));
 return`<h2>Nowa próba</h2><div class="card"><div class="lab">Ćwiczenie</div><select id="pe">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select>
 <div class="lab">…albo nowe ćwiczenie</div><input id="pn" placeholder="Nazwa (opcjonalnie)">
 <div class="lab">Ciężar (kg)</div><input id="pk" inputmode="decimal"><div class="mut" style="margin-top:6px">Data ustawi się sama: ${fmt(tdy())}</div>
 <button class="p" style="width:100%;margin-top:10px" onclick="sp()">Zapisz próbę</button></div>
 <h2>Rekordy</h2><div class="card">${Object.keys(best).map(n=>`<div class="row"><span>${esc(n)}</span><b style="text-align:right">${best[n]} kg</b></div>`).join('')||'<span class="mut">Brak prób</span>'}</div>
 <h2>Historia prób</h2><div class="card"><table>${t.map((x,i)=>`<tr><td>${fmt(x.d)}</td><td>${esc(x.ex)}</td><td><b>${x.kg} kg</b></td><td><button class="x" onclick="dp(${D().trials.indexOf(x)})">✕</button></td></tr>`).join('')||'<tr><td>Brak</td></tr>'}</table></div>`}
function sp(){const n=$('#pn').value.trim()||$('#pe').value,kg=num($('#pk').value);if(!n||kg===null){toast('Podaj ćwiczenie i ciężar');return}
 D().trials.push({d:tdy(),ex:n,kg});sv();toast('Zapisano ✓');R()}
function dp(i){D().trials.splice(i,1);sv();R()}
/* ---- kopia ---- */
function bk(){op(`<h2 style="margin-top:0">Kopia danych</h2><p class="mut">Dane są zapisane w tej przeglądarce. Skopiuj poniższy tekst, żeby zrobić kopię lub przenieść dane na inne urządzenie (wklej i kliknij Wczytaj).</p><textarea id="bt" style="width:100%;height:150px;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:10px">${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:8px"><button class="p" onclick="ib()">Wczytaj</button><button onclick="cl()">Zamknij</button></div>`)}
function ib(){try{const o=JSON.parse($('#bt').value);if(!o.data||!o.data.Adam)throw 0;S=o;sv();cl();W=null;R();toast('Wczytano ✓')}catch(e){toast('Nieprawidłowe dane')}}
R();if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
